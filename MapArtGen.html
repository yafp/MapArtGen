  <!-- Main Viewport Area -->
  <div class="stage">
    <!-- Floating Zoom Controls (4 buttons: Big zoom-in/out & Fine zoom-in/out) -->

      <button type="button" id="zoomOutFineBtn" class="map-zoom-btn" title="Zoom Out (Fine Adjustment)">-</button>
      <button type="button" id="zoomOutBigBtn" class="map-zoom-btn" title="Zoom Out (Big Steps)">--</button>
    </div>

      <!-- Dynamic Label Overlay -->

        <div id="cityCoords" class="map-label-coords" style="color: #111827;">49.4077° N / 8.6908° E</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('settingsForm');
      if (form) form.reset();
      // Ensure UI inputs explicitly synchronize with default values on load
      document.getElementById('roadColor').value = "#374151";
      document.getElementById('boundaryColor').value = "#9ca3af";
      document.getElementById('borderWidth').value = "16";
      document.getElementById('borderWidthVal').textContent = "16";
      document.getElementById('searchInput').value = "Heidelberg";
      document.getElementById('colorPresetSelect').value = "positron";
      
      // Explicitly set default state for section 4 (Floating Box Bottom Right Absolute) and section 6 (None)
      document.getElementById('labelStyle').value = "style-bottom-right-absolute";
      document.getElementById('labelOpacity').value = "100";
      document.getElementById('textFilter').value = "none";
      
      updateBuildingOutlineVisibility();
      updateBorderElementsVisibility();
      updateLabelStyle();
      applyTextFilters();
    });

    window.addEventListener('pageshow', () => {
      const form = document.getElementById('settingsForm');
      if (form) form.reset();
      document.getElementById('labelStyle').value = "style-bottom-right-absolute";
      document.getElementById('labelOpacity').value = "100";
      document.getElementById('textFilter').value = "none";
      document.getElementById('colorPresetSelect').value = "positron";
      updateLabelStyle();
      applyTextFilters();
    });

    // Accordion Control
    const sectionBlocks = document.querySelectorAll('.section-block');
    sectionBlocks.forEach(block => {
      const header = block.querySelector('.section-header');
      header.addEventListener('click', () => {
        const isCollapsed = block.classList.contains('collapsed');
        sectionBlocks.forEach(b => b.classList.add('collapsed'));
        if (isCollapsed) {
          block.classList.remove('collapsed');
        }
      });
    });

    // MapLibre Map Initialization preset centered to Heidelberg
    const map = new maplibregl.Map({
      container: 'map',
      preserveDrawingBuffer: true,
      attributionControl: false,
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [8.69079, 49.40768],
      zoom: 13
    });

    // 4-Button Zoom Controls Event Listeners (Big steps & Fine adjustments)
    document.getElementById('zoomInBigBtn').addEventListener('click', () => {
      map.zoomTo(map.getZoom() + 2, { duration: 300 });
    });
    document.getElementById('zoomInFineBtn').addEventListener('click', () => {
      map.zoomTo(map.getZoom() + 0.25, { duration: 200 });
    });
    document.getElementById('zoomOutFineBtn').addEventListener('click', () => {
      map.zoomTo(map.getZoom() - 0.25, { duration: 200 });
    });
    document.getElementById('zoomOutBigBtn').addEventListener('click', () => {
      map.zoomTo(map.getZoom() - 2, { duration: 300 });
    });

    map.on('load', () => {
      const style = map.getStyle();
      if (style && style.layers) {
        style.layers.forEach(layer => {
          if (layer.id.toLowerCase().includes('building')) {
            map.setLayerZoomRange(layer.id, 10, 24);
          }
        });
      }
      // Force initial execution of styling hooks to match default UI inputs instantly
      triggerAllLayerUpdates();
      applyTextFilters();
      updateLabelStyle();
    });

    // Live Filters Engine
    const mapEl = document.getElementById('map');
    const filterPreset = document.getElementById('filterPreset');
    const contrastVal = document.getElementById('contrastVal');
    const contrastNum = document.getElementById('contrastNum');

    const filterPresets = {
      'none': '',
      'kandinsky': 'saturate(280%) contrast(140%) hue-rotate(-20deg) brightness(105%)',
      'grayscale': 'grayscale(100%)',
      'mellow': 'saturate(70%) sepia(15%) brightness(102%)',
      'cyberpunk': 'saturate(200%) hue-rotate(140deg) contrast(150%)',
      'vintage': 'sepia(50%) contrast(90%) saturate(85%)',
      'high-contrast': 'grayscale(100%) contrast(190%)',
      'popart': 'saturate(300%) contrast(160%) hue-rotate(90deg)',
      'invert': 'invert(100%) hue-rotate(180deg)'
    };

    function applyLiveFilters() {
      const presetKey = filterPreset.value;
      const baseFilter = filterPresets[presetKey] || '';
      const contrastSetting = contrastVal.value;
      contrastNum.textContent = contrastSetting;

      mapEl.style.filter = `${baseFilter} contrast(${contrastSetting}%)`.trim();
    }

    filterPreset.addEventListener('change', applyLiveFilters);
    contrastVal.addEventListener('input', applyLiveFilters);

    // Map Labels Filter
    const textFilter = document.getElementById('textFilter');

    function applyTextFilters() {
      const mode = textFilter.value;
      const style = map.getStyle();
      if (!style || !style.layers) return;

      style.layers.forEach(layer => {
        if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
          const id = layer.id.toLowerCase();
          let show = true;
          if (mode === 'none') {
            show = false;
          } else if (mode === 'cities_only') {
            show = id.includes('place') || id.includes('city') || id.includes('town');
          } else if (mode === 'streets_only') {
            show = id.includes('road') || id.includes('street') || id.includes('transport');
          }
          map.setLayoutProperty(layer.id, 'visibility', show ? 'visible' : 'none');
        }
      });
    }

    textFilter.addEventListener('change', applyTextFilters);

    // Global update triggers for initial map sync
    let updateCallbacks = [];

    // Color & Layer Controllers
    function setupLayerControls(colorId, accentColorId, opacityId, opacityValId, toggleId, layerMatcher) {
      const colorInput = document.getElementById(colorId);
      const accentColorInput = accentColorId ? document.getElementById(accentColorId) : null;
      const opacityInput = document.getElementById(opacityId);
      const opacityValSpan = document.getElementById(opacityValId);
      const toggleInput = document.getElementById(toggleId);

      function update() {
        if (opacityValSpan) opacityValSpan.textContent = opacityInput.value;
        const style = map.getStyle();
        if (!style || !style.layers) return;

        const enabled = toggleInput ? toggleInput.checked : true;
        const opacity = (opacityInput.value / 100) * (enabled ? 1 : 0);
        const mainColor = colorInput.value;
        const accentColor = accentColorInput ? accentColorInput.value : mainColor;

        style.layers.forEach(layer => {
          const matchResult = layerMatcher(layer.id.toLowerCase(), layer.type, layer);
          if (matchResult) {
            map.setLayoutProperty(layer.id, 'visibility', enabled ? 'visible' : 'none');
            
            const activeColor = (matchResult === 'accent') ? accentColor : mainColor;

            if (layer.type === 'fill') {
              map.setPaintProperty(layer.id, 'fill-color', activeColor);
              map.setPaintProperty(layer.id, 'fill-opacity', opacity);
            } else if (layer.type === 'line') {
              map.setPaintProperty(layer.id, 'line-color', activeColor);
              map.setPaintProperty(layer.id, 'line-opacity', opacity);
            } else if (layer.type === 'background') {
              map.setPaintProperty(layer.id, 'background-color', activeColor);
              map.setPaintProperty(layer.id, 'background-opacity', opacity);
            }
          }
        });
      }

      if (colorInput) colorInput.addEventListener('input', update);
      if (accentColorInput) accentColorInput.addEventListener('input', update);
      if (opacityInput) opacityInput.addEventListener('input', update);
      if (toggleInput) toggleInput.addEventListener('change', update);

      updateCallbacks.push(update);
    }

    // Pre-defined color sets definitions and handler
    const colorPresetSelect = document.getElementById('colorPresetSelect');
    const predefinedColorSets = {
      'positron': {
        waterColor: '#8ab4f8', waterOpacity: '100', waterToggle: true,
        forestColor: '#b2d8b0', forestColorAccent: '#c2e1c1', forestOpacity: '100', forestToggle: true,
        landColor: '#f1f3f4', landOpacity: '100', landToggle: true,
        landCoverColor: '#e6e8eb', landCoverColorAccent: '#dadde1', landCoverOpacity: '100', landCoverToggle: true,
        roadColor: '#374151', roadOpacity: '100', roadToggle: true,
        boundaryColor: '#9ca3af', boundaryOpacity: '100', boundaryToggle: true,
        buildingColor: '#e8eaed', buildingOpacity: '100', buildingToggle: true,
        buildingOutlineToggle: true, buildingOutlineColor: '#d1d5db'
      },
      'darkmode': {
        waterColor: '#1e3a8a', waterOpacity: '100', waterToggle: true,
        forestColor: '#064e3b', forestColorAccent: '#065f46', forestOpacity: '100', forestToggle: true,
        landColor: '#111827', landOpacity: '100', landToggle: true,
        landCoverColor: '#1f2937', landCoverColorAccent: '#374151', landCoverOpacity: '100', landCoverToggle: true,
        roadColor: '#9ca3af', roadOpacity: '100', roadToggle: true,
        boundaryColor: '#4b5563', boundaryOpacity: '100', boundaryToggle: true,
        buildingColor: '#374151', buildingOpacity: '100', buildingToggle: true,
        buildingOutlineToggle: true, buildingOutlineColor: '#6b7280'
      },
      'blueprint': {
        waterColor: '#1d4ed8', waterOpacity: '100', waterToggle: true,
        forestColor: '#1e40af', forestColorAccent: '#2563eb', forestOpacity: '100', forestToggle: true,
        landColor: '#0f172a', landOpacity: '100', landToggle: true,
        landCoverColor: '#1e293b', landCoverColorAccent: '#334155', landCoverOpacity: '100', landCoverToggle: true,
        roadColor: '#60a5fa', roadOpacity: '100', roadToggle: true,
        boundaryColor: '#93c5fd', boundaryOpacity: '100', boundaryToggle: true,
        buildingColor: '#1e3a8a', buildingOpacity: '100', buildingToggle: true,
        buildingOutlineToggle: true, buildingOutlineColor: '#93c5fd'
      },
      'warmvintage': {
        waterColor: '#93c5fd', waterOpacity: '100', waterToggle: true,
        forestColor: '#d1fae5', forestColorAccent: '#a7f3d0', forestOpacity: '100', forestToggle: true,

    function applyColorPreset(presetName) {
      if (presetName === 'custom' || !predefinedColorSets[presetName]) return;
      const set = predefinedColorSets[presetName];

      document.getElementById('waterColor').value = set.waterColor;
      document.getElementById('waterOpacity').value = set.waterOpacity;
      document.getElementById('waterToggle').checked = set.waterToggle;

      document.getElementById('forestColor').value = set.forestColor;
      document.getElementById('forestColorAccent').value = set.forestColorAccent;
      document.getElementById('forestOpacity').value = set.forestOpacity;
      document.getElementById('forestToggle').checked = set.forestToggle;

      document.getElementById('landColor').value = set.landColor;
      document.getElementById('landOpacity').value = set.landOpacity;
      document.getElementById('landToggle').checked = set.landToggle;

      document.getElementById('landCoverColor').value = set.landCoverColor;
      document.getElementById('landCoverColorAccent').value = set.landCoverColorAccent;
      document.getElementById('landCoverOpacity').value = set.landCoverOpacity;
      document.getElementById('landCoverToggle').checked = set.landCoverToggle;

      document.getElementById('roadColor').value = set.roadColor;
      document.getElementById('roadOpacity').value = set.roadOpacity;
      document.getElementById('roadToggle').checked = set.roadToggle;

      document.getElementById('boundaryColor').value = set.boundaryColor;
      document.getElementById('boundaryOpacity').value = set.boundaryOpacity;
      document.getElementById('boundaryToggle').checked = set.boundaryToggle;

      document.getElementById('buildingColor').value = set.buildingColor;
      document.getElementById('buildingOpacity').value = set.buildingOpacity;
      document.getElementById('buildingToggle').checked = set.buildingToggle;

      document.getElementById('buildingOutlineToggle').checked = set.buildingOutlineToggle;
      document.getElementById('buildingOutlineColor').value = set.buildingOutlineColor;

      updateBuildingOutlineVisibility();
      triggerAllLayerUpdates();
    }

    colorPresetSelect.addEventListener('change', (e) => {
      applyColorPreset(e.target.value);
    });

    // Whenever any individual layer property is modified manually, switch preset selector to 'custom'
    function setPresetToCustomIfManual() {
      if (colorPresetSelect.value !== 'custom') {
        colorPresetSelect.value = 'custom';
      }
    }

    // Conditional visibility for Building Outline configuration items (container/width removed per requirements)
    const buildingOutlineToggle = document.getElementById('buildingOutlineToggle');

    function updateBuildingOutlineVisibility() {
      // Logic handled via toggling visibility properties directly on layers
    }

    buildingOutlineToggle.addEventListener('change', updateBuildingOutlineVisibility);

    // Dedicated Building Controls (Fill + Selectable Outline)
    function setupBuildingControls() {
      const fillInput = document.getElementById('buildingColor');
      const opacityInput = document.getElementById('buildingOpacity');
      const opacityValSpan = document.getElementById('buildingOpacityVal');
      const toggleInput = document.getElementById('buildingToggle');

      const outlineColorInput = document.getElementById('buildingOutlineColor');

      function update() {
        opacityValSpan.textContent = opacityInput.value;

        const style = map.getStyle();
        if (!style || !style.layers) return;

        const enabled = toggleInput.checked;
        const opacity = (opacityInput.value / 100) * (enabled ? 1 : 0);
        const fillColor = fillInput.value;

        const outlineEnabled = outlineOutlineEnabled();
        const outlineColor = outlineColorInput.value;

        style.layers.forEach(layer => {
          if (layer.id.toLowerCase().includes('building')) {
            map.setLayoutProperty(layer.id, 'visibility', enabled ? 'visible' : 'none');
            
            if (layer.type === 'fill') {
              map.setPaintProperty(layer.id, 'fill-color', fillColor);
              map.setPaintProperty(layer.id, 'fill-opacity', opacity);

              if (outlineEnabled) {
                map.setPaintProperty(layer.id, 'fill-outline-color', outlineColor);
              } else {
                map.setPaintProperty(layer.id, 'fill-outline-color', fillColor);
              }
            } else if (layer.type === 'line') {
              map.setLayoutProperty(layer.id, 'visibility', outlineEnabled ? 'visible' : 'none');
              map.setPaintProperty(layer.id, 'line-color', outlineColor);
              map.setPaintProperty(layer.id, 'line-opacity', opacity);
            }
          }
        });
      }

      function outlineOutlineEnabled() {
        return buildingOutlineToggle.checked && toggleInput.checked;
      }

      fillInput.addEventListener('input', () => { setPresetToCustomIfManual(); update(); });
      opacityInput.addEventListener('input', () => { setPresetToCustomIfManual(); update(); });
      toggleInput.addEventListener('change', () => { setPresetToCustomIfManual(); update(); });

      buildingOutlineToggle.addEventListener('change', () => { setPresetToCustomIfManual(); update(); });
      outlineColorInput.addEventListener('input', () => { setPresetToCustomIfManual(); update(); });

      updateCallbacks.push(update);
    }

    // Hook manual adjustments for other layers to switch to custom
    document.querySelectorAll('.layer-control-card input').forEach(input => {
      input.addEventListener('input', setPresetToCustomIfManual);
      input.addEventListener('change', setPresetToCustomIfManual);
    });

    function triggerAllLayerUpdates() {
      updateCallbacks.forEach(cb => cb());
    }

    map.on('load', () => {
      applyTextFilters();

      // 1. Water (Includes polygon water bodies and thin line rivers/waterways with unified color & hiding logic)
      setupLayerControls('waterColor', null, 'waterOpacity', 'waterOpacityVal', 'waterToggle',
        (id, type) => {
          if ((type === 'fill' || type === 'line') && (id.includes('water') || id.includes('ocean') || id.includes('lake') || id.includes('river') || id.includes('stream') || id.includes('canal') || id.includes('waterway'))) {
            return 'main';
          }
          return false;
        });

      // 2. Greenery & Nature (Expanded matching for deep forests, wood, scrub, and nature reserves while preventing urban landcover overlaps)
      setupLayerControls('forestColor', 'forestColorAccent', 'forestOpacity', 'forestOpacityVal', 'forestToggle',
        (id, type, layer) => {
          const sourceLayer = (layer['source-layer'] || '').toLowerCase();
          const isUrbanOrCommercial = id.includes('commercial') || id.includes('industrial') || id.includes('residential') || sourceLayer.includes('urban');
          if (isUrbanOrCommercial) return false;

          const isGreen = id.includes('park') || id.includes('green') || id.includes('wood') || 
                          id.includes('forest') || id.includes('cemetery') || id.includes('recreation') ||
                          id.includes('pitch') || id.includes('scrub') || id.includes('grass') || 
                          id.includes('landcover') || id.includes('landuse') || sourceLayer.includes('landcover') || sourceLayer.includes('landuse');
          
          if (isGreen) {
            if (id.includes('forest') || id.includes('wood') || id.includes('reserve') || id.includes('nature') || id.includes('scrub') || id.includes('grass')) {
              return 'main';
            }
            return 'accent';
          }
          return false;
        });

      // 3. Land Background
      setupLayerControls('landColor', null, 'landOpacity', 'landOpacityVal', 'landToggle',
        (id, type) => {
          if (type === 'background' || id === 'background' || id.includes('background')) return 'main';
          return false;
        });

      // 4. Land Cover / Urban Areas
      setupLayerControls('landCoverColor', 'landCoverColorAccent', 'landCoverOpacity', 'landCoverOpacityVal', 'landCoverToggle',
        (id) => {
          if (id.includes('residential')) return 'accent';
          if (id.includes('landcover') || id.includes('landuse') || id.includes('urban') || id.includes('commercial')) return 'main';
          return false;
        });

      // 5. Roads & Streets (Includes Roads, Streets, Bridges, and Traintracks into a single color scheme)
      setupLayerControls('roadColor', null, 'roadOpacity', 'roadOpacityVal', 'roadToggle',
        (id, type) => {
          if (type === 'line' && (id.includes('road') || id.includes('street') || id.includes('highway') || id.includes('transport') || id.includes('bridge') || id.includes('rail') || id.includes('train') || id.includes('track'))) {
            return 'main';
          }
          return false;
        });

      // 5b. Country Borders (Administrative boundaries, continent outlines, and country lines combined)
      setupLayerControls('boundaryColor', null, 'boundaryOpacity', 'boundaryOpacityVal', 'boundaryToggle',
        (id, type, layer) => {
          const sourceLayer = (layer['source-layer'] || '').toLowerCase();
          if (type === 'line' && (id.includes('boundary') || id.includes('border') || id.includes('admin') || id.includes('continent') || id.includes('land') || sourceLayer.includes('boundary') || sourceLayer.includes('admin'))) {
            return 'main';
          }
          return false;
        });

      // 6. Buildings
      setupBuildingControls();

      // Apply default positron preset colors explicitly on initial load
      applyColorPreset('positron');
    });

    // Search via Nominatim
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const cityNameEl = document.getElementById('cityName');
    const cityCoordsEl = document.getElementById('cityCoords');
    let debounceTimer;

    function updateCoordsDisplay() {
      const center = map.getCenter();
      const lat = center.lat.toFixed(4);
      const lng = center.lng.toFixed(4);
      cityCoordsEl.textContent = `${Math.abs(lat)}° ${lat >= 0 ? 'N' : 'S'} / ${Math.abs(lng)}° ${lng >= 0 ? 'E' : 'W'}`;
    }

    map.on('move', updateCoordsDisplay);

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();
      if (query.length < 3) { searchResults.style.display = 'none'; return; }

      debounceTimer = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
          .then(res => res.json())
          .then(data => {
            searchResults.innerHTML = '';
            if (!data.length) { searchResults.style.display = 'none'; return; }

            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'search-item';
              div.textContent = item.display_name;
              div.addEventListener('click', () => {
                map.flyTo({ center: [parseFloat(item.lon), parseFloat(item.lat)], zoom: 12 });
                cityNameEl.textContent = item.display_name.split(',')[0].toUpperCase();
                searchInput.value = item.display_name.split(',')[0];
                searchResults.style.display = 'none';
              });
              searchResults.appendChild(div);
            });
            searchResults.style.display = 'block';
          });
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });

    // Text Label Overlay & Font Styling
    const mapLabelOverlay = document.getElementById('mapLabelOverlay');
    const labelStyle = document.getElementById('labelStyle');
    const labelTextColor = document.getElementById('labelTextColor');
    const labelBgColor = document.getElementById('labelBgColor');
    const labelOpacity = document.getElementById('labelOpacity');
    const opacityNum = document.getElementById('opacityNum');
    const labelFontSelect = document.getElementById('labelFontSelect');

    function updateLabelStyle() {
      opacityNum.textContent = labelOpacity.value;

      // Update font family
      const selectedFont = labelFontSelect.value;
      mapLabelOverlay.style.fontFamily = selectedFont;
      cityNameEl.style.fontFamily = selectedFont;
      cityCoordsEl.style.fontFamily = selectedFont;

      if (labelStyle.value === 'none') {
        mapLabelOverlay.style.display = 'none';
      } else {
        mapLabelOverlay.style.display = 'block';
        mapLabelOverlay.className = `map-label-overlay ${labelStyle.value}`;

        const hex = labelBgColor.value;
        const alpha = labelOpacity.value / 100;
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);

        if (labelStyle.value === 'style-minimal') {
          mapLabelOverlay.style.backgroundColor = 'transparent';
        } else {
          mapLabelOverlay.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        cityNameEl.style.color = labelTextColor.value;
        cityCoordsEl.style.color = labelTextColor.value;
      }
    }

    labelStyle.addEventListener('change', updateLabelStyle);
    labelTextColor.addEventListener('input', updateLabelStyle);
    labelBgColor.addEventListener('input', updateLabelStyle);
    labelOpacity.addEventListener('input', updateLabelStyle);
    labelFontSelect.addEventListener('change', updateLabelStyle);

    // Border & Aspect Ratio Controls
    const mapFrame = document.getElementById('mapFrame');
    const borderCheckbox = document.getElementById('borderCheckbox');
    const borderColor = document.getElementById('borderColor');
    const borderWidth = document.getElementById('borderWidth');
    const borderWidthVal = document.getElementById('borderWidthVal');
    const borderUiItems = document.querySelectorAll('.border-ui-item');

    function updateBorderElementsVisibility() {
      const isEnabled = borderCheckbox.checked;
      borderUiItems.forEach(item => {
        item.style.display = isEnabled ? 'flex' : 'none';
      });
    }

    function updateBorderStyle() {
      borderWidthVal.textContent = borderWidth.value;
      updateBorderElementsVisibility();
      if (!borderCheckbox.checked) {
        mapFrame.style.border = 'none';
      } else {
        mapFrame.style.border = `${borderWidth.value}px solid ${borderColor.value}`;
      }
    }

    borderCheckbox.addEventListener('change', updateBorderStyle);
    borderColor.addEventListener('input', updateBorderStyle);
    borderWidth.addEventListener('input', updateBorderStyle);

    const formatSelect = document.getElementById('formatSelect');
    formatSelect.addEventListener('change', () => {
      mapFrame.className = `map-frame ratio-${formatSelect.value}`;
      setTimeout(() => map.resize(), 300);
    });

    // Helper for file download datetimes
    function getFileTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}${mm}${dd}_${hh}${min}${ss}`;
    }

    // High-Res Export Engine & Download Handlers
    const exportBtn = document.getElementById('exportBtn');
    const dimsMap = {
      portrait: { width: 3508, height: 4960 },
      landscape: { width: 4960, height: 3508 },
      square: { width: 5906, height: 5906 }
    };

    exportBtn.addEventListener('click', async () => {
      exportBtn.disabled = true;
      exportBtn.textContent = 'Exporting...';

      if (document.fonts) {
        await document.fonts.ready;
      }

      const format = formatSelect.value;
      const targetDims = dimsMap[format];

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = targetDims.width;
      exportCanvas.height = targetDims.height;
      const ctx = exportCanvas.getContext('2d');

      const scaleFactor = targetDims.width / mapFrame.clientWidth;
      const bWidth = borderCheckbox.checked ? parseInt(borderWidth.value) * scaleFactor : 0;

      // Outer Border
      ctx.fillStyle = borderColor.value;
      ctx.fillRect(0, 0, targetDims.width, targetDims.height);

      // Filter Preset Mapping
      const presetKey = filterPreset.value;
      const baseFilter = filterPresets[presetKey] || '';
      const contrastSetting = contrastVal.value;
      ctx.filter = `${baseFilter} contrast(${contrastSetting}%)`.trim();

      // Render Map
      const mapCanvas = map.getCanvas();
      ctx.drawImage(
        mapCanvas, 
        bWidth, 
        bWidth, 
        targetDims.width - (bWidth * 2), 
        targetDims.height - (bWidth * 2)
      );

      ctx.filter = 'none';

      // Export Label Styles & Font Selection (Scaled properly relative to preview layout)
      if (labelStyle.value !== 'none') {
        const hex = labelBgColor.value;
        const alpha = labelOpacity.value / 100;
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        
        const style = labelStyle.value;
        const fontChoice = labelFontSelect.value;

        // Base proportional factor adjustment to make export fonts/boxes match preview scale perfectly
        const previewRefWidth = mapFrame.clientWidth;
        const proportionalScale = targetDims.width / previewRefWidth;

        if (style === 'style-fullwidth') {
          const bannerHeight = 160 * proportionalScale;
          const bannerY = targetDims.height - bWidth - bannerHeight;
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(bWidth, bannerY, targetDims.width - (bWidth * 2), bannerHeight);

          ctx.textAlign = 'center';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${42 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, targetDims.width / 2, bannerY + (65 * proportionalScale));

          ctx.font = `600 ${22 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, targetDims.width / 2, bannerY + (115 * proportionalScale));

        } else if (style === 'style-fullwidth-right') {
          const bannerHeight = 160 * proportionalScale;
          const bannerY = targetDims.height - bWidth - bannerHeight;
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(bWidth, bannerY, targetDims.width - (bWidth * 2), bannerHeight);

          ctx.textAlign = 'right';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${42 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, targetDims.width - bWidth - (40 * proportionalScale), bannerY + (65 * proportionalScale));

          ctx.font = `600 ${22 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, targetDims.width - bWidth - (40 * proportionalScale), bannerY + (115 * proportionalScale));

        } else if (style === 'style-bottom-right') {
          const boxWidth = 320 * proportionalScale;
          const boxHeight = 120 * proportionalScale;
          const boxX = targetDims.width - bWidth - boxWidth - (36 * proportionalScale);
          const boxY = targetDims.height - bWidth - boxHeight - (36 * proportionalScale);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

          ctx.textAlign = 'center';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${32 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, boxX + (boxWidth / 2), boxY + (50 * proportionalScale));

          ctx.font = `600 ${18 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, boxX + (boxWidth / 2), boxY + (90 * proportionalScale));

        } else if (style === 'style-bottom-right-absolute') {
          const boxWidth = 320 * proportionalScale;
          const boxHeight = 120 * proportionalScale;
          const boxX = targetDims.width - bWidth - boxWidth;
          const boxY = targetDims.height - bWidth - boxHeight;
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

          ctx.textAlign = 'right';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${32 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, boxX + boxWidth - (20 * proportionalScale), boxY + (50 * proportionalScale));

          ctx.font = `600 ${18 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, boxX + boxWidth - (20 * proportionalScale), boxY + (90 * proportionalScale));

        } else if (style === 'style-deck') {
          const bannerHeight = 120 * proportionalScale;
          const bannerY = targetDims.height - bWidth - bannerHeight - (30 * proportionalScale);
          const margin = 30 * proportionalScale;

          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(bWidth + margin, bannerY, targetDims.width - (bWidth * 2) - (margin * 2), bannerHeight);

          ctx.textAlign = 'left';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${36 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, bWidth + margin + (30 * proportionalScale), bannerY + (70 * proportionalScale));

          ctx.textAlign = 'right';
          ctx.font = `600 ${20 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, targetDims.width - bWidth - margin - (30 * proportionalScale), bannerY + (70 * proportionalScale));

        } else if (style === 'style-toptag') {
          const boxWidth = 360 * proportionalScale;
          const boxHeight = 100 * proportionalScale;
          const boxX = (targetDims.width - boxWidth) / 2;
          const boxY = bWidth + (50 * proportionalScale);

          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

          ctx.textAlign = 'center';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${30 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, targetDims.width / 2, boxY + (45 * proportionalScale));

          ctx.font = `600 ${16 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, targetDims.width / 2, boxY + (75 * proportionalScale));

        } else if (style === 'style-badge') {
          const boxWidth = 420 * proportionalScale;
          const boxHeight = 180 * proportionalScale;
          const boxX = (targetDims.width - boxWidth) / 2;
          const boxY = (targetDims.height - boxHeight) / 2;

          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
          ctx.strokeStyle = labelTextColor.value;
          ctx.lineWidth = 4 * proportionalScale;
          ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

          ctx.textAlign = 'center';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${38 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, targetDims.width / 2, boxY + (75 * proportionalScale));

          ctx.font = `600 ${20 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, targetDims.width / 2, boxY + (125 * proportionalScale));

        } else {
          // Floating Box & Minimal Mode
          if (style !== 'style-minimal') {
            const boxWidth = 320 * proportionalScale;
            const boxHeight = 120 * proportionalScale;
            const boxX = (targetDims.width - boxWidth) / 2;
            const boxY = targetDims.height - bWidth - (160 * proportionalScale);
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
          }

          const boxY = targetDims.height - bWidth - (160 * proportionalScale);
          ctx.textAlign = 'center';
          ctx.fillStyle = labelTextColor.value;
          ctx.font = `800 ${32 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityNameEl.textContent, targetDims.width / 2, boxY + (50 * proportionalScale));

          ctx.font = `600 ${18 * proportionalScale}px ${fontChoice}`;
          ctx.fillText(cityCoordsEl.textContent, targetDims.width / 2, boxY + (90 * proportionalScale));
        }
      }

      // Download Triggers following precise naming formatting rules
      const fileTimestamp = getFileTimestamp();
      const cleanLocationName = cityNameEl.textContent.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
      
      const link = document.createElement('a');
      link.download = `MapArtGen_${cleanLocationName}_${fileTimestamp}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();

      exportBtn.disabled = false;
      exportBtn.innerHTML = `Export <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
    });
  </script>
</body>
</html>
